name: Publication synchronisée des corrigés
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-corrections
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Importer la clé privée PSC
        env:
          PSC_PRIVATE_KEY: ${{ secrets.PSC_PRIVATE_KEY }}
        run: |
          test -n "$PSC_PRIVATE_KEY"
          printf '%s' "$PSC_PRIVATE_KEY" | gpg --batch --import
      - name: Publier les corrections arrivées à échéance
        id: release
        run: python3 scripts/publish_due_corrections.py
      - name: Enregistrer la publication sur GitHub
        if: steps.release.outputs.published == 'true'
        env:
          FILES: ${{ steps.release.outputs.files }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          IFS=',' read -ra paths <<< "$FILES"
          git add -- "${paths[@]}"
          git commit -m "Publish scheduled correction"
          git push
